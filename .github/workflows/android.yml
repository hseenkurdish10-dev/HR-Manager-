
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/hr-manager.jks
          test -s android/app/hr-manager.jks
          cat > android/signing.init.gradle <<'EOF'
          gradle.projectsEvaluated {
              allprojects {
                  if (plugins.hasPlugin('com.android.application')) {
                      android.signingConfigs.debug.storeFile =
                          file("${rootProject.projectDir}/app/hr-manager.jks")
                      android.signingConfigs.debug.storePassword =
                          System.getenv("KEYSTORE_PASSWORD")
                      android.signingConfigs.debug.keyAlias =
                          System.getenv("KEY_ALIAS")
                      android.signingConfigs.debug.keyPassword =
                          System.getenv("KEYSTORE_PASSWORD")
                  }
              }
          }
          EOF

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -I signing.init.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HR-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
